# Qdrant vector store for the RAG knowledge base (Phase 2+).
#
# Phase 2 initially indexes in Qdrant *local (embedded)* mode so nothing has to
# be running. Before wiring the API/Agent (concurrent reads) start this service
# and migrate the existing points — embeddings are copied as-is, no re-embedding:
#
#   docker compose -f docker/docker-compose.yml up -d qdrant
#   .\.venv\Scripts\python.exe scripts/migrate_qdrant.py --to-url http://localhost:6333
#   $env:QDRANT_URL = "http://localhost:6333"     # then rerun search/build
#
# API + frontend services are added in the deployment phase (P10).

services:
  qdrant:
    # Pin a digest/tag after the first successful pull for reproducible builds.
    image: qdrant/qdrant:latest
    container_name: ai-finance-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / web UI
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
